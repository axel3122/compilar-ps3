name: Build PS3 Toolchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake autoconf automake libtool pkg-config zlib1g-dev libssl-dev python3 python3-pip wget curl bison flex texinfo gawk libgmp-dev libelf-dev libncurses-dev libmpfr-dev libmpc-dev

      - name: Build Toolchain
        run: |
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh

      - name: Compress result
        run: tar -czvf ps3dev.tar.gz /usr/local/ps3dev

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps3dev
          path: ps3dev.tar.gz
